name: Build and release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'

      - name: Check for release signing key
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
          else
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
          fi

      - name: Set up release signing key
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/android/app/release.keystore"
          cat > "$GITHUB_WORKSPACE/android/key.properties" <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=$GITHUB_WORKSPACE/android/app/release.keystore
          EOF

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true